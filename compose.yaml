services:
  clientfold:
    build:
      context: .
      dockerfile: Dockerfile
    image: clientfold:local
    init: true
    restart: unless-stopped
    ports:
      - "${CLIENTFOLD_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/data/clientfold.db
      AUTH_SECRET: ${AUTH_SECRET:-local-container-secret-change-before-production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ClientFold <hello@clientfold.com>}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      NEXT_PUBLIC_ATTRIBUTION_COOKIE: ${NEXT_PUBLIC_ATTRIBUTION_COOKIE:-cf_attrib}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CONVERSIONS_ACCESS_TOKEN: ${META_CONVERSIONS_ACCESS_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      GOOGLE_DATA_MANAGER_ACCESS_TOKEN: ${GOOGLE_DATA_MANAGER_ACCESS_TOKEN:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_CONVERSION_ACTION_ID: ${GOOGLE_ADS_CONVERSION_ACTION_ID:-}
      AD_CONVERSION_WEBHOOK_URL: ${AD_CONVERSION_WEBHOOK_URL:-}
      AD_CONVERSION_WEBHOOK_SECRET: ${AD_CONVERSION_WEBHOOK_SECRET:-}
      AUTOMATIC_REMINDERS_ENABLED: ${AUTOMATIC_REMINDERS_ENABLED:-false}
      REMINDER_JOB_SECRET: ${REMINDER_JOB_SECRET:-}
      AUTOMATIC_REMINDER_BATCH_SIZE: ${AUTOMATIC_REMINDER_BATCH_SIZE:-50}
    volumes:
      - clientfold_data:/data
      - clientfold_uploads:/app/.storage

  reminder-worker:
    profiles: ["automation"]
    image: clientfold:local
    depends_on:
      - clientfold
    command: ["node", "scripts/reminder-worker.mjs"]
    environment:
      REMINDER_JOB_SECRET: ${REMINDER_JOB_SECRET:-}
      REMINDER_WORKER_URL: http://clientfold:3000/api/internal/reminders/run
      REMINDER_POLL_INTERVAL_MS: ${REMINDER_POLL_INTERVAL_MS:-900000}
    restart: unless-stopped

volumes:
  clientfold_data:
  clientfold_uploads:
